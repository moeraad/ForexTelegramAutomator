[project]
name = "copytrades"
version = "0.1.0"
description = "Telegram → AI → MT5 signal bridge for gold trading"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "python-telegram-bot>=21.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
